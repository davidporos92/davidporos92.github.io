# Builds the site with GitHub's own Jekyll/github-pages image (the same gem set
# as the Gemfile) and deploys it to GitHub Pages.
# Requires: repo Settings > Pages > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button, e.g. to publish a post dated in the future once its day comes
    inputs:
      crosspost:
        description: "Posts to cross-post, space-separated paths (default: posts dated today)"
        required: false
        default: ""
      dry_run:
        description: "Cross-post dry run: render only, don't call dev.to"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'davidporos92/davidporos92.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  # Cross-posts new or changed posts once the site is live: a draft on dev.to,
  # and ready-to-paste markdown for Hashnode (see the run summary and artifact).
  crosspost:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TZ: Europe/Budapest # same as _config.yml, so "dated today" matches Jekyll
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Find posts to cross-post
        id: posts
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_POSTS: ${{ inputs.crosspost }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_POSTS" ]; then
              posts="$INPUT_POSTS"
            else
              posts=$(find _posts -name "$(date +%F)-*.md" | sort)
            fi
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            posts=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- '_posts/**.md')
          else
            posts=$(git diff-tree --root --no-commit-id --name-only -r --diff-filter=AM "$GITHUB_SHA" -- '_posts/**.md')
          fi
          echo "list=$(echo $posts)" >> "$GITHUB_OUTPUT"
          echo "Posts: ${posts:-none}"

      - name: Cross-post
        if: steps.posts.outputs.list != ''
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          POSTS: ${{ steps.posts.outputs.list }}
        run: ruby scripts/crosspost.rb $DRY_RUN --out crosspost $POSTS

      - uses: actions/upload-artifact@v7
        if: steps.posts.outputs.list != ''
        with:
          name: crosspost
          path: crosspost/
